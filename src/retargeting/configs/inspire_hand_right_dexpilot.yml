# Local copy of dex-retargeting's teleop/inspire_hand_right_dexpilot.yml.
# Only change: scaling_factor 1.15 -> 1.45.
#
# Upstream's 1.15 leaves inspire's fingers permanently curled (~0.61 rad) on
# HaWoR/MANO input. Inspire's base->fingertip span (216 mm fully extended)
# exceeds the scaled human wrist->fingertip target (181 mm at 1.15), so the
# optimiser curls the fingers to shorten the reach. Raising the scaling makes
# the target match inspire's geometry. Measured on egodex color/0 (59 frames,
# mean fingertip error vs MANO):
#   1.15 -> 29.0 mm | 1.30 -> 19.5 mm | 1.45 -> 15.8 mm | 1.60 -> 15.4 mm
# xhand on the same sequence: 13.4 mm. Past 1.45 the gain flattens.
# NB: tuned on one sequence — re-check if hand scale differs markedly.
retargeting:
  type: DexPilot
  urdf_path: inspire_hand/inspire_hand_right.urdf

  # Target refers to the retargeting target, which is the robot hand
  target_joint_names: [ 'pinky_proximal_joint', 'ring_proximal_joint', 'middle_proximal_joint', 'index_proximal_joint',
                        'thumb_proximal_pitch_joint', 'thumb_proximal_yaw_joint' ]
  wrist_link_name: "base"
  finger_tip_link_names: [ "thumb_tip",  "index_tip", "middle_tip", "ring_tip", "pinky_tip" ]
  scaling_factor: 1.45

  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  low_pass_alpha: 0.2
