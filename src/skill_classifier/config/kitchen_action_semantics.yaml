# Semantic metadata for the English kitchen action labels stored in
# gt_labels.json. English object phrases are also used for open-vocabulary
# grounding and annotation/result visualizations.

schema_version: 1
action_labels: [HangCup, StackContainers, PlaceLightGreenSnackBoxInTrashBin, PlaceRedSnackBoxInTrashBin, WipeFloorWithSponge, Transition]

objects:
  cup:
    ko: 컵
    prompts: [cup, mug]
    grounding_queries: [cup]
    max_instances: 2
  cup_holder:
    ko: 컵 홀더
    prompts: [green wire cup holder rack, cup holder, mug rack]
    grounding_queries: [green wire cup holder rack]
    max_instances: 1
  food_container:
    ko: 락앤락통
    prompts: [shallow food storage container with lid, plastic food container, lunch box]
    grounding_queries:
      - shallow purple rectangular plastic food container with lid
      - shallow silver rectangular metal food container
    max_instances: 2
  light_green_snack_box:
    ko: 연두색 과자 상자
    prompts: [light green snack box, light green rectangular snack package]
    grounding_queries: [light green snack box]
    max_instances: 1
  red_snack_box:
    ko: 빨간색 과자 상자
    prompts: [red snack box, red rectangular snack package]
    grounding_queries: [red snack box]
    max_instances: 1
  trash_bin:
    ko: 쓰레기통
    prompts: [large white rectangular trash bin, trash bin, waste bin]
    grounding_queries: [large white rectangular trash bin]
    max_instances: 1
  sponge:
    ko: 스펀지
    prompts: [blue rectangular cleaning sponge, cleaning sponge, scrub sponge]
    grounding_queries: [blue rectangular cleaning sponge]
    max_instances: 1
  work_surface:
    ko: 바닥 또는 작업면
    prompts: [floor surface, table surface, work surface]
    max_instances: 1
    grounding_enabled: false

actions:
  HangCup:
    ko: 컵 걸기
    en: Hang the cup on the cup holder
    source_objects: [cup]
    target_objects: [cup_holder]
    tool_objects: []
  StackContainers:
    ko: 락앤락통 겹치기
    en: Stack one food container on another food container
    source_objects: [food_container]
    target_objects: [food_container]
    tool_objects: []
  PlaceLightGreenSnackBoxInTrashBin:
    ko: 연두색 과자 상자를 쓰레기통에 넣기
    en: Place the light green snack box in the trash bin
    source_objects: [light_green_snack_box]
    target_objects: [trash_bin]
    tool_objects: []
  PlaceRedSnackBoxInTrashBin:
    ko: 빨간색 과자 상자를 쓰레기통에 넣기
    en: Place the red snack box in the trash bin
    source_objects: [red_snack_box]
    target_objects: [trash_bin]
    tool_objects: []
  WipeFloorWithSponge:
    ko: 바닥 스펀지로 닦기
    en: Wipe the floor with the sponge
    source_objects: []
    target_objects: [work_surface]
    tool_objects: [sponge]
  Transition:
    ko: 행동 사이 전환
    en: Transition between actions
    source_objects: []
    target_objects: []
    tool_objects: []

conditioning_contract:
  # Every clip receives the same object vocabulary.  Selecting only the
  # ground-truth action sentence would leak the target label.
  use_shared_object_bank_for_every_clip: true
  forbid_ground_truth_selected_prompt: true
  prompt_language: en
